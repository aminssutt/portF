services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
